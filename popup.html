<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nori V Cam</title>
    <link rel="stylesheet" href="files/style.css" />
    <script>
      (function () {
        var saved = localStorage.getItem("nori-theme");
        var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
</head>
<body>
    <div id="notification"></div>

    <div class="header">
      <div class="logo">
        <img src="files/images/Icon.png" height="24" alt="" />
        <h2>Nori V Cam</h2>
      </div>
      <div class="cameraselection">
        <select class="cselement">
          <option value="">Loading...</option>
        </select>
      </div>
      <div class="actions">
        <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.7A8.5 8.5 0 0 1 9.3 3.5a.6.6 0 0 0-.7-.8A9.5 9.5 0 1 0 21.3 15.4a.6.6 0 0 0-.8-.7Z"/></svg>
        </button>
        <div class="sharebtn">
          <a id="share" title="Copy Link"><img src="files/images/share.png" alt="" height="14" /></a>
          <a id="popout" title="Popout"><img src="files/images/popout.png" alt="" height="14" /></a>
        </div>
      </div>
    </div>

    <div class="maincont">
      <div class="camcont">
        <a href="popup.html" target="_blank" id="cpermition"> Camera Permission Required </a>
        <canvas id="maincanwas"></canvas>
      </div>
    </div>

    <div class="navoptions">
      <div class="radioitem selectedradio" data-tab="canvas">
        <img src="files/images/canvas.png" alt="Canvas" height="30" />
      </div>
      <div class="radioitem" data-tab="text">
        <img src="files/images/text.png" alt="Text" height="30" />
      </div>
      <div class="radioitem" data-tab="image">
        <img src="files/images/image.png" alt="Image" height="30" />
      </div>
    </div>

    <video style="display: none" id="maincam"></video>

    <!-- Canvas Settings Tab -->
    <div id="tab-canvas" class="featurecont tab-content tab-active">
      <div class="feature-row">
          <span>Zoom Scale</span>
          <span id="rangetext">1.2x</span>
      </div>
      <input id="scalerange" type="range" min="0.2" max="3" value="1.2" step="0.05" />

      <div class="feature-row">
          <span>Horizontal Pan</span>
          <span id="leftrighttext">0</span>
      </div>
      <input id="leftrightrange" type="range" min="-1000" max="1000" value="0" step="10" />

      <div class="feature-row">
          <span>Vertical Pan</span>
          <span id="updowntext">0</span>
      </div>
      <input id="updownrange" type="range" min="-1000" max="1000" value="0" step="10" />

      <div class="feature-row">
          <span>Rotation</span>
          <span id="rotatetext">0°</span>
      </div>
      <input id="rotaterange" type="range" min="-180" max="180" value="0" step="1" />

      <div class="checkbox-group">
          <label>
              <span>Flip V</span>
              <input id="flipvertical" type="checkbox" />
          </label>
          <label>
              <span>Flip H</span>
              <input id="fliphorizontal" type="checkbox" />
          </label>
      </div>
    </div>

    <!-- Text Overlays Tab -->
    <div id="tab-text" class="featurecont tab-content">
        <div class="add-row">
            <input type="text" id="newTextContent" placeholder="Enter text...">
            <button id="addTextBtn" class="btn-primary">Add</button>
        </div>
        <div id="textList" class="overlay-list"></div>
    </div>

    <!-- Image Overlays Tab -->
    <div id="tab-image" class="featurecont tab-content">
        <div class="add-row">
            <label class="file-upload-btn">
                <span>Upload Image</span>
                <input type="file" id="newImageFile" accept="image/*">
            </label>
        </div>
        <div id="imageList" class="overlay-list"></div>
    </div>

    <footer class="footer">
      <div class="footer-brand">
        <span class="footer-by">Built by</span>
        <a href="https://github.com/omnori" target="_blank" rel="noopener" class="footer-omnori">Omnori</a>
      </div>
      <p class="footer-tagline">Building Products With No End.</p>
      <div class="socials">
        <a href="https://www.instagram.com/omnori.tech" target="_blank" rel="noopener" title="Instagram" aria-label="Omnori on Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>
        </a>
        <a href="https://github.com/omnori" target="_blank" rel="noopener" title="GitHub" aria-label="Omnori on GitHub">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.5 7.5 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        </a>
        <a href="https://discord.gg/5ag9gjsDde" target="_blank" rel="noopener" title="Discord" aria-label="Omnori on Discord">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.32 5.37a17.9 17.9 0 0 0-4.43-1.37c-.19.34-.4.79-.55 1.15a16.6 16.6 0 0 0-4.9 0c-.15-.36-.37-.81-.56-1.15-1.53.26-3 .74-4.43 1.37C2.6 9.9 1.85 14.3 2.18 18.65a18 18 0 0 0 5.5 2.79c.44-.6.84-1.24 1.18-1.92-.65-.24-1.27-.54-1.86-.89.16-.11.31-.23.46-.35a12.8 12.8 0 0 0 10.98 0c.15.12.3.24.46.35-.59.35-1.21.65-1.86.89.34.68.74 1.32 1.18 1.92a18 18 0 0 0 5.5-2.79c.4-5.02-.68-9.38-2.9-13.28ZM9.68 15.9c-.98 0-1.78-.9-1.78-2s.79-2 1.78-2c1 0 1.8.91 1.78 2 0 1.1-.79 2-1.78 2Zm5.64 0c-.98 0-1.78-.9-1.78-2s.79-2 1.78-2c1 0 1.8.91 1.78 2 0 1.1-.78 2-1.78 2Z"/></svg>
        </a>
      </div>
    </footer>
</body>
<script src="files/virtualcam.js"></script>
<script src="files/script.js"></script>
</html>
